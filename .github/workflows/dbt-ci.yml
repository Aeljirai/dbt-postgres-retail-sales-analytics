name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bim
          POSTGRES_PASSWORD: bim
          POSTGRES_DB: bim_warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: dbt_project

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-postgres

      - name: Configure profile
        run: |
          mkdir -p ~/.dbt
          cp profiles.yml.example ~/.dbt/profiles.yml

      - name: dbt debug
        run: dbt debug

      # sources reference raw.* by name (not ref()), so dbt can't infer the
      # seed -> source dependency: load the raw layer first.
      - name: dbt seed
        run: dbt seed

      - name: dbt build (seed, snapshot, run, test)
        run: dbt build

      - name: dbt docs generate
        run: dbt docs generate
