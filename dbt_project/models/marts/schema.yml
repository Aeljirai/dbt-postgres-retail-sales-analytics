version: 2

models:
  - name: dim_product
    description: "One row per product."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: dim_store
    description: "One row per BIM store."
    columns:
      - name: store_id
        tests:
          - unique
          - not_null
      - name: city
        tests:
          - accepted_values:
              arguments:
                values: ['Casablanca', 'Tanger', 'Agadir']

  - name: fact_sales
    description: "One row per product line item within one checkout."
    columns:
      - name: sale_id
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: store_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
